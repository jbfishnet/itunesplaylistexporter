name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test and build macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build native macOS app
        run: ./build.sh
        working-directory: macapp

      - name: Upload built app
        uses: actions/upload-artifact@v4
        with:
          name: Playlist Exporter.app
          path: macapp/dist/Playlist Exporter.app
          if-no-files-found: error
